<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">点云处理链</title>
  <desc id="desc">每一步改变点的数量、几何结构或统计含义</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#17324d" flood-opacity="0.09"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8ca1b7"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#fbfdff"/>
  <text x="52" y="54" text-anchor="start" font-size="26" font-weight="760" fill="#17324d" class="">点云处理链</text>
  <text x="52" y="82" text-anchor="start" font-size="15" font-weight="500" fill="#64778c" class="">每一步改变点的数量、几何结构或统计含义</text>
  <g filter="url(#shadow)"><rect x="55" y="210" width="170" height="135" rx="16" fill="#ffffff" stroke="#cfdae7"/><rect x="55" y="210" width="7" height="135" rx="3.5" fill="#2f6feb"/><text x="77" y="244" text-anchor="start" font-size="20" font-weight="700" fill="#17324d" class="">原始点</text><text x="77" y="273" text-anchor="start" font-size="15" font-weight="500" fill="#64778c" class="">x, y, z, intensity</text><text x="77" y="298" text-anchor="start" font-size="15" font-weight="500" fill="#64778c" class="">逐点时间</text></g><line x1="225" y1="278" x2="285" y2="278" stroke="#8ca1b7" stroke-width="2.5" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="285" y="210" width="170" height="135" rx="16" fill="#ffffff" stroke="#cfdae7"/><rect x="285" y="210" width="7" height="135" rx="3.5" fill="#0891b2"/><text x="307" y="244" text-anchor="start" font-size="20" font-weight="700" fill="#17324d" class="">有效性过滤</text><text x="307" y="273" text-anchor="start" font-size="15" font-weight="500" fill="#64778c" class="">距离、视场</text><text x="307" y="298" text-anchor="start" font-size="15" font-weight="500" fill="#64778c" class="">NaN 与离群点</text></g><line x1="455" y1="278" x2="515" y2="278" stroke="#8ca1b7" stroke-width="2.5" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="515" y="210" width="170" height="135" rx="16" fill="#ffffff" stroke="#cfdae7"/><rect x="515" y="210" width="7" height="135" rx="3.5" fill="#198754"/><text x="537" y="244" text-anchor="start" font-size="20" font-weight="700" fill="#17324d" class="">采样与法向</text><text x="537" y="273" text-anchor="start" font-size="15" font-weight="500" fill="#64778c" class="">体素代表点</text><text x="537" y="298" text-anchor="start" font-size="15" font-weight="500" fill="#64778c" class="">局部协方差</text></g><line x1="685" y1="278" x2="745" y2="278" stroke="#8ca1b7" stroke-width="2.5" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="745" y="210" width="170" height="135" rx="16" fill="#ffffff" stroke="#cfdae7"/><rect x="745" y="210" width="7" height="135" rx="3.5" fill="#7657c8"/><text x="767" y="244" text-anchor="start" font-size="20" font-weight="700" fill="#17324d" class="">配准与分割</text><text x="767" y="273" text-anchor="start" font-size="15" font-weight="500" fill="#64778c" class="">ICP / 图优化</text><text x="767" y="298" text-anchor="start" font-size="15" font-weight="500" fill="#64778c" class="">平面与连通域</text></g><line x1="915" y1="278" x2="975" y2="278" stroke="#8ca1b7" stroke-width="2.5" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="975" y="210" width="170" height="135" rx="16" fill="#ffffff" stroke="#cfdae7"/><rect x="975" y="210" width="7" height="135" rx="3.5" fill="#b45309"/><text x="997" y="244" text-anchor="start" font-size="20" font-weight="700" fill="#17324d" class="">几何结果</text><text x="997" y="273" text-anchor="start" font-size="15" font-weight="500" fill="#64778c" class="">表面、边界</text><text x="997" y="298" text-anchor="start" font-size="15" font-weight="500" fill="#64778c" class="">厚度与体积</text></g><rect x="300" y="390" width="180" height="38" rx="19" fill="#2f6feb" opacity="0.10"/><text x="390.0" y="415" text-anchor="middle" font-size="15" font-weight="650" fill="#2f6feb" class="">保持坐标与时间语义</text><rect x="500" y="390" width="180" height="38" rx="19" fill="#0891b2" opacity="0.10"/><text x="590.0" y="415" text-anchor="middle" font-size="15" font-weight="650" fill="#0891b2" class="">记录参数与损失</text><rect x="700" y="390" width="180" height="38" rx="19" fill="#198754" opacity="0.10"/><text x="790.0" y="415" text-anchor="middle" font-size="15" font-weight="650" fill="#198754" class="">量化覆盖与误差</text>
</svg>