<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">点云目标中心定位</title>
  <desc id="desc">从候选点到稳定空间中心的处理链</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#17324d" flood-opacity="0.09"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8ca1b7"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#fbfdff"/>
  <text x="52" y="54" text-anchor="start" font-size="26" font-weight="760" fill="#17324d" class="">点云目标中心定位</text>
  <text x="52" y="82" text-anchor="start" font-size="15" font-weight="500" fill="#64778c" class="">从候选点到稳定空间中心的处理链</text>
  <g filter="url(#shadow)"><rect x="55" y="205" width="180" height="130" rx="16" fill="#ffffff" stroke="#cfdae7"/><rect x="55" y="205" width="7" height="130" rx="3.5" fill="#2f6feb"/><text x="77" y="239" text-anchor="start" font-size="20" font-weight="700" fill="#17324d" class="">点云输入</text><text x="77" y="268" text-anchor="start" font-size="15" font-weight="500" fill="#64778c" class="">坐标、强度</text><text x="77" y="293" text-anchor="start" font-size="15" font-weight="500" fill="#64778c" class="">时间与传感器位姿</text></g><g filter="url(#shadow)"><rect x="290" y="205" width="180" height="130" rx="16" fill="#ffffff" stroke="#cfdae7"/><rect x="290" y="205" width="7" height="130" rx="3.5" fill="#0891b2"/><text x="312" y="239" text-anchor="start" font-size="20" font-weight="700" fill="#17324d" class="">候选生成</text><text x="312" y="268" text-anchor="start" font-size="15" font-weight="500" fill="#64778c" class="">ROI、地面分离</text><text x="312" y="293" text-anchor="start" font-size="15" font-weight="500" fill="#64778c" class="">强度与密度门限</text></g><g filter="url(#shadow)"><rect x="525" y="205" width="180" height="130" rx="16" fill="#ffffff" stroke="#cfdae7"/><rect x="525" y="205" width="7" height="130" rx="3.5" fill="#198754"/><text x="547" y="239" text-anchor="start" font-size="20" font-weight="700" fill="#17324d" class="">对象聚类</text><text x="547" y="268" text-anchor="start" font-size="15" font-weight="500" fill="#64778c" class="">欧式 / DBSCAN</text><text x="547" y="293" text-anchor="start" font-size="15" font-weight="500" fill="#64778c" class="">连通与尺寸约束</text></g><g filter="url(#shadow)"><rect x="760" y="205" width="180" height="130" rx="16" fill="#ffffff" stroke="#cfdae7"/><rect x="760" y="205" width="7" height="130" rx="3.5" fill="#7657c8"/><text x="782" y="239" text-anchor="start" font-size="20" font-weight="700" fill="#17324d" class="">位置估计</text><text x="782" y="268" text-anchor="start" font-size="15" font-weight="500" fill="#64778c" class="">质心、稳健中心</text><text x="782" y="293" text-anchor="start" font-size="15" font-weight="500" fill="#64778c" class="">包围盒与置信度</text></g><g filter="url(#shadow)"><rect x="995" y="205" width="150" height="130" rx="16" fill="#ffffff" stroke="#cfdae7"/><rect x="995" y="205" width="7" height="130" rx="3.5" fill="#c24156"/><text x="1017" y="239" text-anchor="start" font-size="20" font-weight="700" fill="#17324d" class="">多帧跟踪</text><text x="1017" y="268" text-anchor="start" font-size="15" font-weight="500" fill="#64778c" class="">数据关联</text><text x="1017" y="293" text-anchor="start" font-size="15" font-weight="500" fill="#64778c" class="">状态滤波</text></g><line x1="235" y1="270" x2="290" y2="270" stroke="#8ca1b7" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="470" y1="270" x2="525" y2="270" stroke="#8ca1b7" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="705" y1="270" x2="760" y2="270" stroke="#8ca1b7" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="940" y1="270" x2="995" y2="270" stroke="#8ca1b7" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="1070" y1="335" x2="850" y2="415" stroke="#8ca1b7" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="8 7"/><text x="960.0" y="366.0" text-anchor="middle" font-size="13" font-weight="500" fill="#64778c" class="">预测约束下一帧搜索</text><rect x="380" y="425" width="180" height="38" rx="19" fill="#2f6feb" opacity="0.10"/><text x="470.0" y="450" text-anchor="middle" font-size="15" font-weight="650" fill="#2f6feb" class="">检测率与误检率</text><rect x="575" y="425" width="180" height="38" rx="19" fill="#198754" opacity="0.10"/><text x="665.0" y="450" text-anchor="middle" font-size="15" font-weight="650" fill="#198754" class="">中心位置误差</text><rect x="770" y="425" width="180" height="38" rx="19" fill="#7657c8" opacity="0.10"/><text x="860.0" y="450" text-anchor="middle" font-size="15" font-weight="650" fill="#7657c8" class="">时延与轨迹连续性</text>
</svg>