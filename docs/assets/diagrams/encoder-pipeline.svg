<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">编码器逐点补偿</title>
  <desc id="desc">利用时间对齐后的编码器轨迹恢复每个激光点的机械姿态</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#17324d" flood-opacity="0.09"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8ca1b7"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#fbfdff"/>
  <text x="52" y="54" text-anchor="start" font-size="26" font-weight="760" fill="#17324d" class="">编码器逐点补偿</text>
  <text x="52" y="82" text-anchor="start" font-size="15" font-weight="500" fill="#64778c" class="">利用时间对齐后的编码器轨迹恢复每个激光点的机械姿态</text>
  <g filter="url(#shadow)"><rect x="50" y="140" width="210" height="118" rx="16" fill="#ffffff" stroke="#cfdae7"/><rect x="50" y="140" width="7" height="118" rx="3.5" fill="#2f6feb"/><text x="72" y="174" text-anchor="start" font-size="20" font-weight="700" fill="#17324d" class="">激光点</text><text x="72" y="203" text-anchor="start" font-size="15" font-weight="500" fill="#64778c" class="">坐标 pᴸ</text><text x="72" y="228" text-anchor="start" font-size="15" font-weight="500" fill="#64778c" class="">逐点时刻 tₚ</text></g><g filter="url(#shadow)"><rect x="50" y="320" width="210" height="118" rx="16" fill="#ffffff" stroke="#cfdae7"/><rect x="50" y="320" width="7" height="118" rx="3.5" fill="#0891b2"/><text x="72" y="354" text-anchor="start" font-size="20" font-weight="700" fill="#17324d" class="">编码器</text><text x="72" y="383" text-anchor="start" font-size="15" font-weight="500" fill="#64778c" class="">时刻 tₖ</text><text x="72" y="408" text-anchor="start" font-size="15" font-weight="500" fill="#64778c" class="">角度 θₖ、角速度 ωₖ</text></g><g filter="url(#shadow)"><rect x="325" y="220" width="205" height="128" rx="16" fill="#fffaf4" stroke="#cfdae7"/><rect x="325" y="220" width="7" height="128" rx="3.5" fill="#b45309"/><text x="347" y="254" text-anchor="start" font-size="20" font-weight="700" fill="#17324d" class="">统一时间轴</text><text x="347" y="283" text-anchor="start" font-size="15" font-weight="500" fill="#64778c" class="">t = a·t_device + b</text><text x="347" y="308" text-anchor="start" font-size="15" font-weight="500" fill="#64778c" class="">检查覆盖与采样间隔</text></g><g filter="url(#shadow)"><rect x="595" y="220" width="205" height="128" rx="16" fill="#f7fcf9" stroke="#cfdae7"/><rect x="595" y="220" width="7" height="128" rx="3.5" fill="#198754"/><text x="617" y="254" text-anchor="start" font-size="20" font-weight="700" fill="#17324d" class="">角度插值</text><text x="617" y="283" text-anchor="start" font-size="15" font-weight="500" fill="#64778c" class="">Hermite θ(tₚ)</text><text x="617" y="308" text-anchor="start" font-size="15" font-weight="500" fill="#64778c" class="">端点位置与速度连续</text></g><g filter="url(#shadow)"><rect x="865" y="140" width="255" height="118" rx="16" fill="#faf8ff" stroke="#cfdae7"/><rect x="865" y="140" width="7" height="118" rx="3.5" fill="#7657c8"/><text x="887" y="174" text-anchor="start" font-size="20" font-weight="700" fill="#17324d" class="">轴线刚体变换</text><text x="887" y="203" text-anchor="start" font-size="15" font-weight="500" fill="#64778c" class="">任意轴 a、轴心 c</text><text x="887" y="228" text-anchor="start" font-size="15" font-weight="500" fill="#64778c" class="">外参 Tᴬ←ᴸ 与零角</text></g><g filter="url(#shadow)"><rect x="865" y="320" width="255" height="118" rx="16" fill="#f7faff" stroke="#cfdae7"/><rect x="865" y="320" width="7" height="118" rx="3.5" fill="#2f6feb"/><text x="887" y="354" text-anchor="start" font-size="20" font-weight="700" fill="#17324d" class="">确定性体素融合</text><text x="887" y="383" text-anchor="start" font-size="15" font-weight="500" fill="#64778c" class="">floor(pᴹ / v)</text><text x="887" y="408" text-anchor="start" font-size="15" font-weight="500" fill="#64778c" class="">sum / count 输出均值</text></g><line x1="260" y1="199" x2="325" y2="265" stroke="#8ca1b7" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="260" y1="379" x2="325" y2="307" stroke="#8ca1b7" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="530" y1="284" x2="595" y2="284" stroke="#8ca1b7" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="800" y1="284" x2="865" y2="199" stroke="#8ca1b7" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="992" y1="258" x2="992" y2="320" stroke="#8ca1b7" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="410" y="410" width="255" height="38" rx="19" fill="#b45309" opacity="0.10"/><text x="537.5" y="435" text-anchor="middle" font-size="15" font-weight="650" fill="#b45309" class="">单自由度运动已知</text><rect x="680" y="410" width="165" height="38" rx="19" fill="#198754" opacity="0.10"/><text x="762.5" y="435" text-anchor="middle" font-size="15" font-weight="650" fill="#198754" class="">无需 ICP</text>
</svg>