<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">时空与运动学标定</title>
  <desc id="desc">用同一组观测约束空间外参、时间映射和机械参数</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#17324d" flood-opacity="0.09"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8ca1b7"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#fbfdff"/>
  <text x="52" y="54" text-anchor="start" font-size="26" font-weight="760" fill="#17324d" class="">时空与运动学标定</text>
  <text x="52" y="82" text-anchor="start" font-size="15" font-weight="500" fill="#64778c" class="">用同一组观测约束空间外参、时间映射和机械参数</text>
  <g filter="url(#shadow)"><rect x="55" y="150" width="220" height="120" rx="16" fill="#ffffff" stroke="#cfdae7"/><rect x="55" y="150" width="7" height="120" rx="3.5" fill="#2f6feb"/><text x="77" y="184" text-anchor="start" font-size="20" font-weight="700" fill="#17324d" class="">观测</text><text x="77" y="213" text-anchor="start" font-size="15" font-weight="500" fill="#64778c" class="">点、平面、标靶</text><text x="77" y="238" text-anchor="start" font-size="15" font-weight="500" fill="#64778c" class="">IMU、编码器、时间戳</text></g><g filter="url(#shadow)"><rect x="55" y="340" width="220" height="120" rx="16" fill="#ffffff" stroke="#cfdae7"/><rect x="55" y="340" width="7" height="120" rx="3.5" fill="#0891b2"/><text x="77" y="374" text-anchor="start" font-size="20" font-weight="700" fill="#17324d" class="">先验</text><text x="77" y="403" text-anchor="start" font-size="15" font-weight="500" fill="#64778c" class="">刚体结构</text><text x="77" y="428" text-anchor="start" font-size="15" font-weight="500" fill="#64778c" class="">轴约束、单位与范围</text></g><g filter="url(#shadow)"><rect x="345" y="235" width="225" height="140" rx="16" fill="#fffaf4" stroke="#cfdae7"/><rect x="345" y="235" width="7" height="140" rx="3.5" fill="#b45309"/><text x="367" y="269" text-anchor="start" font-size="20" font-weight="700" fill="#17324d" class="">参数模型</text><text x="367" y="298" text-anchor="start" font-size="15" font-weight="500" fill="#64778c" class="">外参 T</text><text x="367" y="323" text-anchor="start" font-size="15" font-weight="500" fill="#64778c" class="">时钟 a、b</text><text x="367" y="348" text-anchor="start" font-size="15" font-weight="500" fill="#64778c" class="">轴线 a、c、零位 θ₀</text></g><g filter="url(#shadow)"><rect x="640" y="235" width="225" height="140" rx="16" fill="#faf8ff" stroke="#cfdae7"/><rect x="640" y="235" width="7" height="140" rx="3.5" fill="#7657c8"/><text x="662" y="269" text-anchor="start" font-size="20" font-weight="700" fill="#17324d" class="">非线性优化</text><text x="662" y="298" text-anchor="start" font-size="15" font-weight="500" fill="#64778c" class="">几何残差</text><text x="662" y="323" text-anchor="start" font-size="15" font-weight="500" fill="#64778c" class="">稳健核与参数约束</text><text x="662" y="348" text-anchor="start" font-size="15" font-weight="500" fill="#64778c" class="">可观测性检查</text></g><g filter="url(#shadow)"><rect x="935" y="150" width="215" height="120" rx="16" fill="#f7fcf9" stroke="#cfdae7"/><rect x="935" y="150" width="7" height="120" rx="3.5" fill="#198754"/><text x="957" y="184" text-anchor="start" font-size="20" font-weight="700" fill="#17324d" class="">残差验证</text><text x="957" y="213" text-anchor="start" font-size="15" font-weight="500" fill="#64778c" class="">均值、RMSE、P95</text><text x="957" y="238" text-anchor="start" font-size="15" font-weight="500" fill="#64778c" class="">空间与时间分层</text></g><g filter="url(#shadow)"><rect x="935" y="340" width="215" height="120" rx="16" fill="#fff7f8" stroke="#cfdae7"/><rect x="935" y="340" width="7" height="120" rx="3.5" fill="#c24156"/><text x="957" y="374" text-anchor="start" font-size="20" font-weight="700" fill="#17324d" class="">独立复测</text><text x="957" y="403" text-anchor="start" font-size="15" font-weight="500" fill="#64778c" class="">未参与拟合的数据</text><text x="957" y="428" text-anchor="start" font-size="15" font-weight="500" fill="#64778c" class="">重复安装与不同距离</text></g><line x1="275" y1="210" x2="345" y2="275" stroke="#8ca1b7" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="275" y1="400" x2="345" y2="335" stroke="#8ca1b7" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="570" y1="305" x2="640" y2="305" stroke="#8ca1b7" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="865" y1="275" x2="935" y2="210" stroke="#8ca1b7" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="865" y1="335" x2="935" y2="400" stroke="#8ca1b7" stroke-width="2.5" marker-end="url(#arrow)"/>
</svg>