<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">三维算法知识结构</title>
  <desc id="desc">从标定和点云处理到建图与感知的关系</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#17324d" flood-opacity="0.09"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8ca1b7"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#fbfdff"/>
  <text x="52" y="54" text-anchor="start" font-size="26" font-weight="760" fill="#17324d" class="">三维算法知识结构</text>
  <text x="52" y="82" text-anchor="start" font-size="15" font-weight="500" fill="#64778c" class="">从标定和点云处理到建图与感知的关系</text>
  <g filter="url(#shadow)"><rect x="55" y="130" width="250" height="150" rx="16" fill="#f7faff" stroke="#cfdae7"/><rect x="55" y="130" width="7" height="150" rx="3.5" fill="#2f6feb"/><text x="77" y="164" text-anchor="start" font-size="20" font-weight="700" fill="#17324d" class="">建图 Mapping</text><text x="77" y="193" text-anchor="start" font-size="15" font-weight="500" fill="#64778c" class="">运动补偿</text><text x="77" y="218" text-anchor="start" font-size="15" font-weight="500" fill="#64778c" class="">状态估计与全局一致性</text></g><g filter="url(#shadow)"><rect x="335" y="130" width="250" height="150" rx="16" fill="#f6fcfd" stroke="#cfdae7"/><rect x="335" y="130" width="7" height="150" rx="3.5" fill="#0891b2"/><text x="357" y="164" text-anchor="start" font-size="20" font-weight="700" fill="#17324d" class="">标定 Calibration</text><text x="357" y="193" text-anchor="start" font-size="15" font-weight="500" fill="#64778c" class="">空间外参</text><text x="357" y="218" text-anchor="start" font-size="15" font-weight="500" fill="#64778c" class="">时间偏移与运动学参数</text></g><g filter="url(#shadow)"><rect x="615" y="130" width="250" height="150" rx="16" fill="#f7fcf9" stroke="#cfdae7"/><rect x="615" y="130" width="7" height="150" rx="3.5" fill="#198754"/><text x="637" y="164" text-anchor="start" font-size="20" font-weight="700" fill="#17324d" class="">点云 Point Cloud</text><text x="637" y="193" text-anchor="start" font-size="15" font-weight="500" fill="#64778c" class="">滤波、配准、分割</text><text x="637" y="218" text-anchor="start" font-size="15" font-weight="500" fill="#64778c" class="">几何拟合与质量评价</text></g><g filter="url(#shadow)"><rect x="895" y="130" width="250" height="150" rx="16" fill="#faf8ff" stroke="#cfdae7"/><rect x="895" y="130" width="7" height="150" rx="3.5" fill="#7657c8"/><text x="917" y="164" text-anchor="start" font-size="20" font-weight="700" fill="#17324d" class="">感知 Perception</text><text x="917" y="193" text-anchor="start" font-size="15" font-weight="500" fill="#64778c" class="">目标检测与聚类</text><text x="917" y="218" text-anchor="start" font-size="15" font-weight="500" fill="#64778c" class="">中心定位和多帧跟踪</text></g><line x1="180" y1="310" x2="460" y2="310" stroke="#8ca1b7" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="8 7"/><text x="320.0" y="301.0" text-anchor="middle" font-size="13" font-weight="500" fill="#64778c" class="">坐标与时间</text><line x1="460" y1="350" x2="740" y2="350" stroke="#8ca1b7" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="8 7"/><text x="600.0" y="341.0" text-anchor="middle" font-size="13" font-weight="500" fill="#64778c" class="">规范点云</text><line x1="740" y1="390" x2="1020" y2="390" stroke="#8ca1b7" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="8 7"/><text x="880.0" y="381.0" text-anchor="middle" font-size="13" font-weight="500" fill="#64778c" class="">空间特征</text><text x="600" y="455" text-anchor="middle" font-size="20" font-weight="650" fill="#17324d" class="">统一的坐标系、时间轴和不确定性描述连接四类算法</text><rect x="340" y="485" width="165" height="38" rx="19" fill="#2f6feb" opacity="0.10"/><text x="422.5" y="510" text-anchor="middle" font-size="15" font-weight="650" fill="#2f6feb" class="">模型与假设</text><rect x="520" y="485" width="165" height="38" rx="19" fill="#0891b2" opacity="0.10"/><text x="602.5" y="510" text-anchor="middle" font-size="15" font-weight="650" fill="#0891b2" class="">观测与残差</text><rect x="700" y="485" width="165" height="38" rx="19" fill="#198754" opacity="0.10"/><text x="782.5" y="510" text-anchor="middle" font-size="15" font-weight="650" fill="#198754" class="">优化与评价</text>
</svg>