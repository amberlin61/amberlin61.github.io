site_name: Amber Lin · Algorithm Notes
site_description: 激光雷达、点云建图、标定与感知算法笔记
site_author: amberlin61
site_url: https://amberlin61.github.io/
repo_url: https://github.com/amberlin61/amberlin61.github.io
repo_name: amberlin61/amberlin61.github.io
edit_uri: edit/main/docs/

theme:
  name: material
  language: zh
  font: false
  icon:
    logo: material/vector-polyline
    repo: fontawesome/brands/github
  features:
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tooltips
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: light-blue
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式

nav:
  - 首页: index.md
  - 建图:
      - 方法总览: mapping/index.md
      - 编码器逐点补偿: mapping/dual-encoder.md
      - FAST-LIO2: mapping/kalman-fast-lio.md
      - 编码器约束站点优化: mapping/encoder-global-opt.md
  - 标定: calibration/index.md
  - 点云处理: point-cloud/index.md
  - 感知: perception/index.md
  - 参考与版本: provenance.md

plugins:
  - search:
      lang:
        - zh
        - en

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/amberlin61
      name: GitHub

extra_css:
  - stylesheets/extra.css

strict: true
